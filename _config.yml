title: Julio Cesar Fausto
author: Julio Cesar Fausto
description: Technology and software development expert.
url: https://jcfausto.com
baseurl: ""
lang: en

logo: /assets/images/julio-portrait.png

social:
  name: Julio Cesar Fausto
  links:
    - https://github.com/jcfausto
    - https://www.linkedin.com/in/jcfausto
    - https://www.instagram.com/juliofaustophotography/
    - https://jcfausto.com/photography/

permalink: /writing/:title/

collections:
  thoughts:
    output: true
    permalink: /thoughts/:name/
  books:
    output: true
    permalink: /bookshelf/:name/
  galleries:
    output: true
    permalink: /photography/:name/
  photo_journal:
    output: true
    permalink: /photography/journal/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      language: en
      facet: write
  - scope:
      path: ""
      type: thoughts
    values:
      layout: thought
      facet: write
  - scope:
      path: ""
      type: books
    values:
      layout: book
      language: en
      facet: photo
  - scope:
      path: ""
      type: galleries
    values:
      layout: gallery
      facet: photo
  - scope:
      path: ""
      type: photo_journal
    values:
      layout: photo-journal
      language: en
      facet: photo
  - scope:
      path: ""
    values:
      layout: default
      facet: work

exclude:
  - Dockerfile
  - docker-compose.yml
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .ruby-lsp
  - scripts
  - books_to_process.csv

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  path: atom.xml
  excerpt_only: true

sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never
