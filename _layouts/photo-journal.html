---
layout: default
---

<article class="post wrap">
  <header class="post-head">
    <div class="eyebrow">
      {{ page.language | default: 'en' | upcase }}
      ·
      {{ page.date | date: "%-d %b %Y" }}
    </div>
    <h1 class="title">{{ page.title | escape }}</h1>
    {% if page.original_url %}
      <p class="post-archive-note"><a href="{{ page.original_url }}">Originally published</a> on juliofaustophotography.com</p>
    {% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p class="post-back"><a href="{{ '/photography/journal/' | relative_url }}">← The journal</a></p>
</article>
